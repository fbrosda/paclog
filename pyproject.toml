[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paclog"
version = "0.2.0"
description = "Analytics and visualizations for Arch Linux pacman logs"
# README.org is Emacs org-mode, which setuptools has no content type for.
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Fabian Brosda", email = "f.brosda@gmx.de" }]
keywords = ["arch-linux", "pacman", "pandas", "matplotlib", "analytics"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paclog = "paclog.cli:main"

[project.urls]
Homepage = "https://github.com/fbrosda/paclog"

[tool.setuptools.packages.find]
include = ["paclog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
